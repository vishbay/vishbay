<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1b1530"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a3ffc"/><stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <style>
      .t{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .fade{opacity:0;animation:f .9s ease forwards}
      .d2{animation-delay:.35s}
      @keyframes f{to{opacity:1}}
      .bar{transform-origin:left;transform:scaleX(0);animation:g 1.2s .5s ease forwards}
      @keyframes g{to{transform:scaleX(1)}}
    </style>
  </defs>
  <rect width="900" height="200" rx="14" fill="url(#bg)"/>
  <text x="48" y="92" class="t fade" font-size="46" font-weight="700" fill="#f0f6fc">Vish Bayavarapu</text>
  <rect x="48" y="108" width="120" height="4" rx="2" fill="url(#ac)" class="bar"/>
  <text x="48" y="150" class="t fade d2" font-size="20" fill="#9aa4b2">Measuring where AI agent tokens go.</text>
  <g class="fade d2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#2dd4bf">
    <text x="840" y="58" text-anchor="end">$ cram audit</text>
  </g>
</svg>
